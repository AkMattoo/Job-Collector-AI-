name: Collect jobs

on:
  schedule:
    - cron: "0 14 * * *"     # daily 14:00 UTC = 7am Seattle
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write             # lets the job commit updated data back to the repo

concurrency:
  group: collect
  cancel-in-progress: false   # never run two collectors on the same data at once

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests (a broken collector never touches your data)
        run: python -m pytest -q

      - name: Collect and score
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m collector.main
      - name: Commit results
        run: |
          git config user.name "job-agent-bot"
          git config user.email "job-agent-bot@users.noreply.github.com"
          git add data/scored.json public/data/jobs.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: daily collection $(date -u +%F)"
          # Someone may have pushed while we were scoring. Replay on top and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push race, retrying..."
            sleep 5
          done
          exit 1
